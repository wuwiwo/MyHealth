<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💪 哑铃小本本</title>
  <style>
    /* ============================================
       CSS Variables & Reset
       ============================================ */
    :root {
      --coral: #FF6B9D;
      --coral-dark: #e85a8a;
      --coral-light: #ffe0ec;
      --yellow: #FFD93D;
      --yellow-light: #fff3c4;
      --mint: #6BCB77;
      --mint-light: #d4f5d8;
      --mint-dark: #56b862;
      --sky: #4D96FF;
      --sky-light: #d6e8ff;
      --purple: #A78BFA;
      --purple-light: #e8dfff;
      --orange: #FF8C5A;
      --orange-light: #ffdcc9;
      --bg: #FFF8F0;
      --card: #FFFFFF;
      --text: #2D3436;
      --text-secondary: #636E72;
      --text-light: #B2BEC3;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 8px;
      --radius-pill: 999px;
      --max-width: 480px;
      --header-height: 56px;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================
       Scrollbar
       ============================================ */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--coral-light);
      border-radius: 4px;
    }

    /* ============================================
       App Shell
       ============================================ */
    #app {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 16px 100px;
      position: relative;
    }

    /* ============================================
       Header
       ============================================ */
    .app-header {
      background: linear-gradient(135deg, var(--coral), var(--orange));
      margin: 0 -16px 0;
      padding: 20px 20px 28px;
      color: white;
      position: relative;
      overflow: hidden;
      border-radius: 0 0 28px 28px;
    }
    .app-header::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.10);
      border-radius: 50%;
    }
    .app-header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 150px;
      height: 150px;
      background: rgba(255,255,255,0.07);
      border-radius: 50%;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title span {
      font-size: 1.6rem;
    }
    .header-streak {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(4px);
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }
    .header-stats {
      display: flex;
      gap: 24px;
    }
    .header-stat-item {
      display: flex;
      flex-direction: column;
    }
    .header-stat-label {
      font-size: 0.7rem;
      opacity: 0.8;
      font-weight: 500;
    }
    .header-stat-value {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .header-stat-unit {
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.85;
    }

    /* ============================================
       Date Navigation
       ============================================ */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0 12px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 10px 16px;
      box-shadow: var(--shadow);
    }
    .date-nav-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: var(--yellow-light);
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.2s;
      color: var(--text);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .date-nav-btn:active {
      transform: scale(0.90);
    }
    .date-nav-btn--today {
      background: var(--sky-light);
      font-size: 0.75rem;
      font-weight: 700;
      width: auto;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      gap: 4px;
    }
    .date-display {
      text-align: center;
      flex: 1;
    }
    .date-display__main {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .date-display__sub {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .date-badge {
      display: inline-block;
      background: var(--coral-light);
      color: var(--coral-dark);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ============================================
       Section Titles
       ============================================ */
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .section-title .icon {
      font-size: 1.2rem;
    }

    /* ============================================
       Add Entry Card / Button
       ============================================ */
    .add-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border: 2px dashed var(--coral-light);
      border-radius: var(--radius);
      background: transparent;
      color: var(--coral);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .add-toggle-btn:active {
      background: var(--coral-light);
    }

    .add-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 4px;
      display: none;
      animation: slideDown 0.3s ease;
    }
    .add-card.open {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    /* Exercise Name Input */
    .exercise-input-wrap {
      position: relative;
    }
    .exercise-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #f0e6e0;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      background: var(--bg);
      transition: border-color 0.2s;
      outline: none;
      color: var(--text);
    }
    .exercise-input:focus {
      border-color: var(--coral);
    }
    .exercise-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .exercise-suggestions button {
      padding: 4px 14px;
      border: 1.5px solid var(--purple-light);
      background: var(--purple-light);
      color: var(--purple);
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .exercise-suggestions button:active {
      background: var(--purple);
      color: white;
      border-color: var(--purple);
    }

    /* Weight Selector */
    .weight-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .weight-btn {
      min-width: 44px;
      height: 44px;
      padding: 0 14px;
      border: 2px solid #f0e6e0;
      border-radius: var(--radius-pill);
      background: var(--card);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-secondary);
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .weight-btn:active {
      transform: scale(0.93);
    }
    .weight-btn.selected {
      background: var(--coral);
      color: white;
      border-color: var(--coral);
      box-shadow: 0 2px 8px rgba(255,107,157,0.3);
    }

    /* Reps Stepper */
    .reps-row {
      display: flex;
      gap: 16px;
    }
    .reps-group {
      flex: 1;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 2px solid #f0e6e0;
      overflow: hidden;
    }
    .stepper-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: background 0.15s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .stepper-btn:active {
      background: #e8e0d8;
    }
    .stepper-value {
      flex: 1;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 4px 0;
      min-width: 40px;
      color: var(--text);
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--coral), var(--orange));
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .submit-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* ============================================
       Entries List
       ============================================ */
    .entries-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--coral);
      position: relative;
      overflow: hidden;
    }
    .entry-card.completed {
      border-left-color: var(--mint);
    }
    .entry-card.partial {
      border-left-color: var(--yellow);
    }

    .entry-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .entry-exercise {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .entry-weight-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--sky-light);
      color: var(--sky);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
    }
    .entry-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .entry-action-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .entry-action-btn:active {
      transform: scale(0.88);
    }
    .entry-action-btn--edit {
      background: var(--yellow-light);
    }
    .entry-action-btn--edit:active {
      background: var(--yellow);
    }
    .entry-action-btn--delete {
      background: var(--orange-light);
    }
    .entry-action-btn--delete:active {
      background: var(--orange);
      color: white;
    }

    .entry-progress {
      margin-top: 12px;
    }
    .entry-progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }
    .entry-reps-target {
      color: var(--text-secondary);
    }
    .entry-reps-actual {
      font-weight: 700;
    }
    .entry-reps-actual.done {
      color: var(--mint);
    }
    .entry-reps-actual.over {
      color: var(--sky);
    }
    .entry-reps-actual.under {
      color: var(--orange);
    }

    .progress-bar {
      height: 8px;
      background: #f0e6e0;
      border-radius: var(--radius-pill);
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      border-radius: var(--radius-pill);
      transition: width 0.5s ease;
      background: linear-gradient(90deg, var(--coral), var(--orange));
    }
    .progress-fill.done {
      background: linear-gradient(90deg, var(--mint), var(--mint-dark));
    }
    .progress-fill.over {
      background: linear-gradient(90deg, var(--sky), #6cb4ff);
    }

    .entry-time {
      margin-top: 8px;
      font-size: 0.7rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .empty-state__emoji {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
    }
    .empty-state__text {
      font-size: 0.95rem;
      font-weight: 500;
    }
    .empty-state__sub {
      font-size: 0.8rem;
      margin-top: 4px;
      color: var(--text-light);
    }

    /* ============================================
       Stats Section
       ============================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-card--wide {
      grid-column: 1 / -1;
    }
    .stat-card__icon {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }
    .stat-card__value {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .stat-card__label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .stat-card--rate .stat-card__value {
      color: var(--coral);
    }
    .stat-card--total .stat-card__value {
      color: var(--sky);
    }
    .stat-card--volume .stat-card__value {
      color: var(--purple);
    }
    .stat-card--streak .stat-card__value {
      color: var(--orange);
    }

    .stat-ring {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stat-ring svg {
      width: 80px;
      height: 80px;
      transform: rotate(-90deg);
    }
    .stat-ring__bg {
      fill: none;
      stroke: #f0e6e0;
      stroke-width: 8;
    }
    .stat-ring__fill {
      fill: none;
      stroke: var(--coral);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s ease;
    }
    .stat-ring__text {
      position: absolute;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }

    /* ============================================
       Edit Modal (Bottom Sheet)
       ============================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.open {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-sheet {
      background: var(--card);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: var(--max-width);
      padding: 24px 20px 32px;
      animation: sheetUp 0.3s ease;
      max-height: 85vh;
      overflow-y: auto;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 4px;
      margin: 0 auto 20px;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }
    .modal-actions button:active {
      transform: scale(0.96);
    }
    .modal-btn--cancel {
      background: #f0e6e0;
      color: var(--text-secondary);
    }
    .modal-btn--save {
      background: linear-gradient(135deg, var(--coral), var(--orange));
      color: white;
    }

    /* ============================================
       Delete Confirmation
       ============================================ */
    .delete-confirm {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
      padding: 20px;
    }
    .delete-confirm.open {
      display: flex;
    }
    .delete-box {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      animation: popIn 0.25s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .delete-box__emoji {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    .delete-box__text {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .delete-box__sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }
    .delete-box__actions {
      display: flex;
      gap: 10px;
    }
    .delete-box__actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .delete-box__actions button:active {
      transform: scale(0.96);
    }
    .delete-btn--no {
      background: #f0e6e0;
      color: var(--text-secondary);
    }
    .delete-btn--yes {
      background: var(--orange);
      color: white;
    }

    /* ============================================
       Toast
       ============================================ */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--text);
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast--success {
      background: var(--mint);
    }
    .toast--error {
      background: var(--orange);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(-10px); }
    }

    /* ============================================
       Celebrate Animation
       ============================================ */
    .celebrate-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg) scale(0);
        opacity: 1;
      }
      20% {
        transform: translateY(20vh) rotate(180deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg) scale(0.5);
        opacity: 0;
      }
    }

    /* ============================================
       Responsive Tweaks
       ============================================ */
    @media (max-width: 360px) {
      #app { padding: 0 12px 80px; }
      .app-header { padding: 16px 16px 24px; border-radius: 0 0 20px 20px; }
      .header-title { font-size: 1.25rem; }
      .header-stat-value { font-size: 1rem; }
      .weight-btn { min-width: 38px; height: 38px; padding: 0 10px; font-size: 0.8rem; }
    }

    @media (min-width: 600px) {
      #app { padding: 0 24px 120px; }
      .app-header { margin: 0 -24px 0; padding: 28px 32px 32px; border-radius: 0 0 32px 32px; }
      .date-nav { padding: 12px 20px; }
      .stats-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
      .stat-card--wide { grid-column: auto; }
    }

    /* ============================================
       Utility
       ============================================ */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
  </style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="header-title">
        <span>💪</span> 哑铃小本本
      </div>
      <div class="header-streak">
        <span>🔥</span> <span id="streakCount">0</span> 天
      </div>
    </div>
    <div class="header-sub">
      <div class="header-stats">
        <div class="header-stat-item">
          <span class="header-stat-label">今日完成</span>
          <span class="header-stat-value"><span id="todayDone">0</span><span class="header-stat-unit">/</span><span id="todayTotal">0</span></span>
        </div>
        <div class="header-stat-item">
          <span class="header-stat-label">总次数</span>
          <span class="header-stat-value"><span id="todayReps">0</span><span class="header-stat-unit"> 次</span></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Date Nav -->
  <nav class="date-nav" id="dateNav">
    <button class="date-nav-btn" id="prevDay" aria-label="前一天">◀</button>
    <div class="date-display">
      <div class="date-display__main" id="dateDisplayMain">加载中...</div>
      <div class="date-display__sub" id="dateDisplaySub"></div>
    </div>
    <button class="date-nav-btn" id="nextDay" aria-label="后一天">▶</button>
    <button class="date-nav-btn date-nav-btn--today" id="goToday">📍 今天</button>
  </nav>

  <!-- Section: 今日记录 -->
  <div class="section-title"><span class="icon">🏋️</span> 今日训练</div>

  <!-- Add Toggle -->
  <button class="add-toggle-btn" id="addToggleBtn">➕ 新增一组</button>

  <!-- Add Card -->
  <div class="add-card" id="addCard">
    <div class="form-group">
      <label class="form-label">动作名称</label>
      <div class="exercise-input-wrap">
        <input class="exercise-input" id="exerciseInput" list="exerciseList" placeholder="输入或选择动作..." autocomplete="off">
        <datalist id="exerciseList"></datalist>
      </div>
      <div class="exercise-suggestions" id="suggestionBtns"></div>
    </div>

    <div class="form-group">
      <label class="form-label">重量 (kg)</label>
      <div class="weight-grid" id="weightGrid"></div>
    </div>

    <div class="form-group">
      <label class="form-label">次数</label>
      <div class="reps-row">
        <div class="reps-group">
          <div class="form-label">目标</div>
          <div class="stepper">
            <button class="stepper-btn" data-stepper="target" data-dir="-">−</button>
            <span class="stepper-value" id="targetValue">12</span>
            <button class="stepper-btn" data-stepper="target" data-dir="+">+</button>
          </div>
        </div>
        <div class="reps-group">
          <div class="form-label">实际</div>
          <div class="stepper">
            <button class="stepper-btn" data-stepper="actual" data-dir="-">−</button>
            <span class="stepper-value" id="actualValue">12</span>
            <button class="stepper-btn" data-stepper="actual" data-dir="+">+</button>
          </div>
        </div>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn">✨ 记录！</button>
  </div>

  <!-- Entries List -->
  <div class="entries-list" id="entriesList"></div>

  <!-- Stats Section -->
  <div class="section-title"><span class="icon">📊</span> 本周概览</div>
  <div class="stats-grid" id="statsGrid"></div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ 编辑记录</div>
    <div class="form-group">
      <label class="form-label">动作名称</label>
      <input class="exercise-input" id="editExercise" placeholder="动作名称">
    </div>
    <div class="form-group">
      <label class="form-label">重量 (kg)</label>
      <div class="weight-grid" id="editWeightGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">次数</label>
      <div class="reps-row">
        <div class="reps-group">
          <div class="form-label">目标</div>
          <div class="stepper">
            <button class="stepper-btn" data-stepper="edit-target" data-dir="-">−</button>
            <span class="stepper-value" id="editTargetValue">12</span>
            <button class="stepper-btn" data-stepper="edit-target" data-dir="+">+</button>
          </div>
        </div>
        <div class="reps-group">
          <div class="form-label">实际</div>
          <div class="stepper">
            <button class="stepper-btn" data-stepper="edit-actual" data-dir="-">−</button>
            <span class="stepper-value" id="editActualValue">12</span>
            <button class="stepper-btn" data-stepper="edit-actual" data-dir="+">+</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn--cancel" id="editCancel">取消</button>
      <button class="modal-btn--save" id="editSave">💾 保存</button>
    </div>
  </div>
</div>

<!-- Delete Confirmation -->
<div class="delete-confirm" id="deleteConfirm">
  <div class="delete-box">
    <div class="delete-box__emoji">🗑️</div>
    <div class="delete-box__text">确定删除这条记录吗？</div>
    <div class="delete-box__sub">删除后无法恢复哦</div>
    <div class="delete-box__actions">
      <button class="delete-btn--no" id="deleteNo">取消</button>
      <button class="delete-btn--yes" id="deleteYes">😢 删除</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
  /* ============================================
     🦴 Data Layer
     ============================================ */
  const STORAGE_KEY = 'dumbbell-tracker-v1';

  const COMMON_WEIGHTS = [2, 3, 4, 5, 6, 7, 8, 10, 12, 15, 20, 25];

  const EXERCISE_SUGGESTIONS = [
    '二头弯举', '肩推', '深蹲', '卧推', '划船',
    '硬拉', '侧平举', '前平举', '锤式弯举', '俯身飞鸟',
    '颈后臂屈伸', '俯身臂屈伸', '直立划船', '推举', '阿诺德推举',
    '哑铃飞鸟', '哑铃耸肩', '弓步蹲', '保加利亚深蹲', '站姿提踵'
  ];

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function toDateStr(date) {
    return date.getFullYear() + '-' +
      String(date.getMonth() + 1).padStart(2, '0') + '-' +
      String(date.getDate()).padStart(2, '0');
  }

  function parseDate(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function formatDisplay(dateStr) {
    const d = parseDate(dateStr);
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const month = d.getMonth() + 1;
    const day = d.getDate();
    const wd = weekdays[d.getDay()];
    const isToday = dateStr === todayStr();
    return {
      main: `${month}月${day}日`,
      sub: isToday ? `${wd} · 今天` : wd
    };
  }

  function daysBetween(a, b) {
    const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((db - da) / (1000 * 60 * 60 * 24));
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.entries)) return data.entries;
      }
    } catch (_) { /* ignore */ }
    return [];
  }

  function saveData(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, entries }));
  }

  let _entries = loadData();

  function getEntries(dateStr) {
    return _entries.filter(e => e.date === dateStr)
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  }

  function addEntry(entry) {
    entry.id = uid();
    entry.createdAt = Date.now();
    _entries.push(entry);
    saveData(_entries);
    return entry;
  }

  function updateEntry(id, data) {
    const idx = _entries.findIndex(e => e.id === id);
    if (idx === -1) return null;
    _entries[idx] = { ..._entries[idx], ...data, updatedAt: Date.now() };
    saveData(_entries);
    return _entries[idx];
  }

  function deleteEntry(id) {
    _entries = _entries.filter(e => e.id !== id);
    saveData(_entries);
  }

  function getAllDates() {
    const set = new Set(_entries.map(e => e.date));
    return [...set].sort();
  }

  function getStreak() {
    const dates = getAllDates();
    if (dates.length === 0) return 0;
    const today = todayStr();
    const set = new Set(dates);
    let count = 0;
    let d = new Date();
    // Check from today backwards
    while (true) {
      const s = toDateStr(d);
      if (set.has(s)) {
        count++;
        d.setDate(d.getDate() - 1);
      } else {
        // If today hasn't been logged yet, still check from yesterday
        if (count === 0) {
          d.setDate(d.getDate() - 1);
          continue;
        }
        break;
      }
    }
    return count;
  }

  function getWeekEntries() {
    const now = new Date();
    const dayOfWeek = now.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const monday = new Date(now);
    monday.setDate(now.getDate() + mondayOffset);
    const mondayStr = toDateStr(monday);
    return _entries.filter(e => e.date >= mondayStr);
  }

  /* ============================================
     🎨 Toast
     ============================================ */
  let toastTimer = null;

  function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast' + (type ? ' toast--' + type : '');
    const icons = { success: '✅', error: '😅', info: '💡' };
    toast.textContent = (icons[type] || '💪') + ' ' + message;
    container.appendChild(toast);

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      container.innerHTML = '';
    }, 2200);
  }

  /* ============================================
     🎉 Celebrate
     ============================================ */
  function celebrate() {
    const overlay = document.createElement('div');
    overlay.className = 'celebrate-overlay';
    const colors = ['var(--coral)', 'var(--yellow)', 'var(--mint)', 'var(--sky)', 'var(--purple)', 'var(--orange)'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (4 + Math.random() * 8) + 'px';
      c.style.height = (4 + Math.random() * 8) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      c.style.animationDelay = Math.random() * 0.5 + 's';
      overlay.appendChild(c);
    }
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 3500);
  }

  /* ============================================
     🖌️ Render Helpers
     ============================================ */
  function buildWeightGrid(container, selected, onChange) {
    container.innerHTML = '';
    COMMON_WEIGHTS.forEach(w => {
      const btn = document.createElement('button');
      btn.className = 'weight-btn' + (w === selected ? ' selected' : '');
      btn.textContent = w + ' kg';
      btn.dataset.weight = w;
      btn.addEventListener('click', () => {
        container.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        if (onChange) onChange(w);
      });
      container.appendChild(btn);
    });
  }

  function renderEntries(dateStr) {
    const list = document.getElementById('entriesList');
    const entries = getEntries(dateStr);

    if (entries.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="empty-state__emoji">😴</span>
          <div class="empty-state__text">今天还没记录呢</div>
          <div class="empty-state__sub">点击上方「新增一组」开始吧！</div>
        </div>
      `;
      return;
    }

    list.innerHTML = entries.map(e => {
      const ratio = e.targetReps > 0 ? e.actualReps / e.targetReps : 0;
      const pct = Math.min(ratio, 1) * 100;
      const isDone = ratio >= 1;
      const isOver = ratio > 1;
      let statusClass = 'under';
      let actualClass = 'under';
      if (isOver) { statusClass = 'over'; actualClass = 'over'; }
      else if (ratio >= 1) { statusClass = 'done'; actualClass = 'done'; }

      const timeStr = e.createdAt
        ? new Date(e.createdAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        : '';

      return `
        <div class="entry-card ${isDone ? 'completed' : 'partial'}" data-id="${e.id}">
          <div class="entry-header">
            <div class="entry-exercise">
              ${e.exercise}
              <span class="entry-weight-badge">🏋️ ${e.weight} kg</span>
            </div>
            <div class="entry-actions">
              <button class="entry-action-btn entry-action-btn--edit" data-action="edit" data-id="${e.id}">✏️</button>
              <button class="entry-action-btn entry-action-btn--delete" data-action="delete" data-id="${e.id}">🗑️</button>
            </div>
          </div>
          <div class="entry-progress">
            <div class="entry-progress-text">
              <span class="entry-reps-target">🎯 目标 ${e.targetReps} 次</span>
              <span class="entry-reps-actual ${actualClass}">
                ${e.actualReps} 次 ${isDone ? (isOver ? '🔥' : '✅') : ''}
              </span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill ${statusClass}" style="width: ${pct}%"></div>
            </div>
          </div>
          ${timeStr ? `<div class="entry-time">🕐 ${timeStr}</div>` : ''}
        </div>
      `;
    }).join('');

    // Attach event listeners
    list.querySelectorAll('[data-action="edit"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const entry = _entries.find(e => e.id === id);
        if (entry) openEditModal(entry);
      });
    });

    list.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        pendingDeleteId = id;
        document.getElementById('deleteConfirm').classList.add('open');
      });
    });
  }

  let pendingDeleteId = null;

  function renderHeaderStats(dateStr) {
    const entries = getEntries(dateStr);
    const done = entries.filter(e => e.actualReps >= e.targetReps).length;
    const total = entries.length;
    const reps = entries.reduce((s, e) => s + e.actualReps, 0);

    document.getElementById('todayDone').textContent = done;
    document.getElementById('todayTotal').textContent = total;
    document.getElementById('todayReps').textContent = reps;
    document.getElementById('streakCount').textContent = getStreak();
  }

  function renderWeekStats() {
    const grid = document.getElementById('statsGrid');
    const weekEntries = getWeekEntries();
    const totalEntries = weekEntries.length;
    const totalReps = weekEntries.reduce((s, e) => s + e.actualReps, 0);
    const totalVolume = weekEntries.reduce((s, e) => s + e.weight * e.actualReps, 0);
    const doneCount = weekEntries.filter(e => e.actualReps >= e.targetReps).length;
    const rate = totalEntries > 0 ? Math.round((doneCount / totalEntries) * 100) : 0;

    // Count exercises
    const exCount = {};
    weekEntries.forEach(e => {
      exCount[e.exercise] = (exCount[e.exercise] || 0) + 1;
    });
    const topEx = Object.entries(exCount).sort((a, b) => b[1] - a[1]);
    const favEx = topEx.length > 0 ? topEx[0][0] : '暂无';

    // Ring progress circumference
    const circumference = 2 * Math.PI * 36;

    grid.innerHTML = `
      <div class="stat-card stat-card--rate">
        <div class="stat-card__icon">🎯</div>
        <div class="stat-ring">
          <svg viewBox="0 0 80 80">
            <circle class="stat-ring__bg" cx="40" cy="40" r="36"/>
            <circle class="stat-ring__fill" cx="40" cy="40" r="36"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${circumference - (circumference * rate / 100)}"/>
          </svg>
          <span class="stat-ring__text">${rate}%</span>
        </div>
        <div class="stat-card__label">完成率</div>
      </div>
      <div class="stat-card stat-card--total">
        <div class="stat-card__icon">💪</div>
        <div class="stat-card__value">${totalReps}</div>
        <div class="stat-card__label">总次数</div>
      </div>
      <div class="stat-card stat-card--volume">
        <div class="stat-card__icon">🏋️</div>
        <div class="stat-card__value">${totalVolume}</div>
        <div class="stat-card__label">总容量 (kg)</div>
      </div>
      <div class="stat-card stat-card--streak">
        <div class="stat-card__icon">⭐</div>
        <div class="stat-card__value">${favEx}</div>
        <div class="stat-card__label">最常练</div>
      </div>
    `;
  }

  /* ============================================
     📅 Date Display
     ============================================ */
  let currentDate = todayStr();

  function updateDateDisplay() {
    const fmt = formatDisplay(currentDate);
    document.getElementById('dateDisplayMain').textContent = fmt.main;
    document.getElementById('dateDisplaySub').textContent = fmt.sub;
  }

  /* ============================================
     🖊️ Edit Modal
     ============================================ */
  let editingEntry = null;

  function openEditModal(entry) {
    editingEntry = entry;
    document.getElementById('editExercise').value = entry.exercise;
    document.getElementById('editTargetValue').textContent = entry.targetReps;
    document.getElementById('editActualValue').textContent = entry.actualReps;

    buildWeightGrid(document.getElementById('editWeightGrid'), entry.weight, (w) => {
      editingEntry._editWeight = w;
    });

    document.getElementById('editModal').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
    editingEntry = null;
  }

  /* ============================================
     ⚙️ App State
     ============================================ */
  let addFormOpen = false;
  let selectedWeight = COMMON_WEIGHTS[2]; // default 5kg

  /* ============================================
     🚀 Init
     ============================================ */
  function init() {
    const today = todayStr();
    currentDate = today;

    // ---- Build static UI ----
    buildWeightGrid(document.getElementById('weightGrid'), selectedWeight, (w) => {
      selectedWeight = w;
    });

    // Exercise suggestions
    const suggestionContainer = document.getElementById('suggestionBtns');
    EXERCISE_SUGGESTIONS.forEach(name => {
      const btn = document.createElement('button');
      btn.textContent = name;
      btn.addEventListener('click', () => {
        document.getElementById('exerciseInput').value = name;
      });
      suggestionContainer.appendChild(btn);
    });

    // Datalist
    const datalist = document.getElementById('exerciseList');
    EXERCISE_SUGGESTIONS.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      datalist.appendChild(opt);
    });

    // ---- Render ----
    render();

    // ---- Event Delegation ----

    // Date navigation
    document.getElementById('prevDay').addEventListener('click', () => {
      const d = parseDate(currentDate);
      d.setDate(d.getDate() - 1);
      currentDate = toDateStr(d);
      render();
    });

    document.getElementById('nextDay').addEventListener('click', () => {
      const d = parseDate(currentDate);
      d.setDate(d.getDate() + 1);
      currentDate = toDateStr(d);
      render();
    });

    document.getElementById('goToday').addEventListener('click', () => {
      currentDate = todayStr();
      render();
    });

    // Toggle add form
    document.getElementById('addToggleBtn').addEventListener('click', () => {
      const card = document.getElementById('addCard');
      addFormOpen = !addFormOpen;
      card.classList.toggle('open', addFormOpen);
      document.getElementById('addToggleBtn').textContent = addFormOpen
        ? '✖ 收起'
        : '➕ 新增一组';
      if (addFormOpen) {
        document.getElementById('exerciseInput').focus();
      }
    });

    // Steppers (add form)
    document.querySelectorAll('#addCard .stepper-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.stepper; // 'target' or 'actual'
        const dir = btn.dataset.dir;
        const valueEl = document.getElementById(type === 'target' ? 'targetValue' : 'actualValue');
        let val = parseInt(valueEl.textContent, 10);
        if (dir === '+') {
          val = Math.min(val + 1, 999);
        } else {
          val = Math.max(val - 1, 0);
        }
        valueEl.textContent = val;
      });
    });

    // Steppers (edit modal)
    document.querySelectorAll('#editModal .stepper-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.stepper; // 'edit-target' or 'edit-actual'
        const dir = btn.dataset.dir;
        const id = type === 'edit-target' ? 'editTargetValue' : 'editActualValue';
        const valueEl = document.getElementById(id);
        let val = parseInt(valueEl.textContent, 10);
        if (dir === '+') {
          val = Math.min(val + 1, 999);
        } else {
          val = Math.max(val - 1, 0);
        }
        valueEl.textContent = val;
      });
    });

    // Submit
    document.getElementById('submitBtn').addEventListener('click', () => {
      const exercise = document.getElementById('exerciseInput').value.trim();
      if (!exercise) {
        showToast('请输入动作名称', 'error');
        return;
      }
      const target = parseInt(document.getElementById('targetValue').textContent, 10);
      const actual = parseInt(document.getElementById('actualValue').textContent, 10);

      addEntry({
        date: currentDate,
        exercise,
        weight: selectedWeight,
        targetReps: target,
        actualReps: actual,
      });

      // Reset form
      document.getElementById('exerciseInput').value = '';
      document.getElementById('targetValue').textContent = '12';
      document.getElementById('actualValue').textContent = '12';
      selectedWeight = COMMON_WEIGHTS[2];
      document.querySelectorAll('#weightGrid .weight-btn').forEach(b => {
        b.classList.toggle('selected', parseInt(b.dataset.weight) === selectedWeight);
      });

      // Close form
      document.getElementById('addCard').classList.remove('open');
      addFormOpen = false;
      document.getElementById('addToggleBtn').textContent = '➕ 新增一组';

      showToast('记录成功！继续加油 💪', 'success');

      // Celebrate if all entries completed
      const todayEntries = getEntries(currentDate);
      const allDone = todayEntries.length > 0 && todayEntries.every(e => e.actualReps >= e.targetReps);
      if (allDone) {
        setTimeout(celebrate, 300);
      }

      render();
    });

    // Edit Save
    document.getElementById('editSave').addEventListener('click', () => {
      if (!editingEntry) return;
      const exercise = document.getElementById('editExercise').value.trim();
      if (!exercise) {
        showToast('请输入动作名称', 'error');
        return;
      }
      const target = parseInt(document.getElementById('editTargetValue').textContent, 10);
      const actual = parseInt(document.getElementById('editActualValue').textContent, 10);
      const weight = editingEntry._editWeight || editingEntry.weight;

      updateEntry(editingEntry.id, { exercise, weight, targetReps: target, actualReps: actual });
      closeEditModal();
      showToast('已更新 ✨', 'success');
      render();
    });

    // Edit Cancel
    document.getElementById('editCancel').addEventListener('click', closeEditModal);

    // Close modal on overlay click
    document.getElementById('editModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeEditModal();
    });

    // Delete confirm
    document.getElementById('deleteYes').addEventListener('click', () => {
      if (pendingDeleteId) {
        deleteEntry(pendingDeleteId);
        pendingDeleteId = null;
        document.getElementById('deleteConfirm').classList.remove('open');
        showToast('已删除', 'info');
        render();
      }
    });

    document.getElementById('deleteNo').addEventListener('click', () => {
      pendingDeleteId = null;
      document.getElementById('deleteConfirm').classList.remove('open');
    });

    // Close delete on overlay click
    document.getElementById('deleteConfirm').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        pendingDeleteId = null;
        document.getElementById('deleteConfirm').classList.remove('open');
      }
    });
  }

  function render() {
    updateDateDisplay();
    renderEntries(currentDate);
    renderHeaderStats(currentDate);
    renderWeekStats();
  }

  // Start
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
