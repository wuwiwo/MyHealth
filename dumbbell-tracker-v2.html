<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🔥 铁量</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
  <link rel="stylesheet" href="dumbbell-tracker-v2.css?v2">
</head>
<body>

<div id="app">
  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-top">
        <div class="header-brand">
          <div class="header-logo">💪</div>
          <div class="header-title-group">
            <div class="header-title">铁<span>量</span></div>
            <div class="header-subtitle">Dumbbell Tracker</div>
          </div>
        </div>
        <div class="header-right">
          <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
          <div class="header-streak">🔥 <span id="streakCount">0</span> <small>天</small></div>
          <div class="sync-indicator" id="syncIndicator" title="同步状态">🔄</div>
        </div>
      </div>
      <div class="header-metrics">
        <div class="header-metric">
          <div class="header-metric__value orange"><span id="todayDone">0</span>/<span id="todayTotal">0</span></div>
          <div class="header-metric__label">完成</div>
        </div>
        <div class="header-metric">
          <div class="header-metric__value green"><span id="todayReps">0</span></div>
          <div class="header-metric__label">总次数</div>
        </div>
        <div class="header-metric">
          <div class="header-metric__value blue"><span id="todayVolume">0</span></div>
          <div class="header-metric__label">容量 (kg)</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="log">📋 日志</button>
    <button class="tab-btn" data-tab="plans">📋 计划</button>
  </div>

  <!-- ===== TAB: LOG ===== -->
  <div class="tab-content active" id="tabLog">
    <nav class="date-nav">
      <button class="date-nav-btn" id="prevDay">◀</button>
      <div class="date-display">
        <div class="date-display__main" id="dateDisplayMain">加载中...</div>
        <div class="date-display__sub" id="dateDisplaySub"></div>
      </div>
      <button class="date-nav-btn" id="nextDay">▶</button>
      <button class="date-nav-btn date-nav-btn--today" id="goToday">📍 今天</button>
    </nav>

    <div class="section-title">今日训练</div>
    <button class="add-toggle-btn" id="addToggleBtn" onclick="toggleAddForm()">＋ 新增一组</button>

    <div class="add-card" id="addCard">
      <div class="form-group">
        <label class="form-label">动作名称</label>
        <input class="exercise-input" id="exerciseInput" list="exerciseList" placeholder="输入或选择动作..." autocomplete="off">
        <datalist id="exerciseList"></datalist>
        <div class="exercise-suggestions" id="suggestionBtns"></div>
      </div>
      <div class="form-group">
        <label class="form-label">重量 (kg)</label>
        <div class="weight-grid" id="weightGrid"></div>
      </div>
      <div class="form-group">
        <label class="form-label">次数</label>
        <div class="reps-row">
          <div class="reps-group">
            <div class="form-label">目标</div>
            <div class="stepper">
              <button class="stepper-btn" data-stepper="target" data-dir="-">−</button>
              <span class="stepper-value" id="targetValue">12</span>
              <button class="stepper-btn" data-stepper="target" data-dir="+">+</button>
            </div>
          </div>
          <div class="reps-group">
            <div class="form-label">实际</div>
            <div class="stepper">
              <button class="stepper-btn" data-stepper="actual" data-dir="-">−</button>
              <span class="stepper-value" id="actualValue">12</span>
              <button class="stepper-btn" data-stepper="actual" data-dir="+">+</button>
            </div>
          </div>
        </div>
      </div>
      <button class="submit-btn" id="submitBtn">⚡ 记录！</button>
    </div>

    <div class="entries-list" id="entriesList"></div>

    <div class="section-title">📅 月热力图</div>
    <div class="heatmap-section" id="heatmapSection"></div>

    <div class="section-title">本周概览</div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <!-- ===== TAB: PLANS ===== -->
  <div class="tab-content" id="tabPlans">
    <div class="section-title" style="margin-top:16px;">训练计划</div>
    <div id="planList"></div>
    <button class="add-toggle-btn" id="createPlanBtn" style="margin-top:4px;" onclick="createNewPlan()">＋ 新建计划</button>
    <div class="section-title" style="margin-top:32px;">数据管理</div>
    <div style="display:flex;gap:10px;">
      <button class="plan-card__btn plan-card__btn--edit" style="flex:1;padding:14px;" onclick="exportData()">📤 导出数据</button>
      <button class="plan-card__btn plan-card__btn--edit" style="flex:1;padding:14px;" onclick="importData()">📥 导入数据</button>
    </div>
    <div style="text-align:center;margin-top:8px;font-size:0.7rem;color:var(--text-muted);">
      导出为 JSON 文件，导入会覆盖现有数据
    </div>

    <div class="section-title" style="margin-top:24px;">📡 多设备同步</div>
    <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:0.8rem;color:var(--text-secondary);">
        <span id="syncStatusText">🔄 就绪</span>
        <span style="flex:1"></span>
        <span id="syncTimeText" style="font-size:0.7rem;color:var(--text-muted);"></span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="plan-card__btn plan-card__btn--start" style="flex:1;padding:12px;" id="syncPushBtn">📤 上传到服务器</button>
        <button class="plan-card__btn plan-card__btn--edit" style="flex:1;padding:12px;" id="syncPullBtn">📥 从服务器下载</button>
      </div>
      <div style="font-size:0.7rem;color:var(--text-muted);margin-top:8px;line-height:1.5;">
        💡 自动同步每 30 秒检查一次，取最新数据。手动操作可强制上传/下载。
      </div>
    </div>
  </div>
</div>

<!-- ===== WORKOUT SESSION ===== -->
<div class="workout-overlay" id="workoutOverlay">
  <div class="workout-header">
    <div></div>
    <div style="text-align:center">
      <div class="workout-header__title" id="woTitle">训练</div>
      <div class="workout-header__progress" id="woProgress">1/3</div>
    </div>
    <button class="workout-close-btn" id="woClose">✕</button>
  </div>
  <div class="workout-track" id="woTrack"></div>
  <div class="workout-body" id="woBody"></div>
</div>

<!-- ===== PLAN EDITOR ===== -->
<div class="modal-overlay" id="planEditorModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">编辑计划</div>
    <div class="form-group">
      <label class="form-label">计划名称</label>
      <input class="exercise-input" id="pePlanName" placeholder="例如：上肢推、全身燃脂..." autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">动作列表</label>
      <div class="plan-ex-list" id="peExList"></div>
      <button class="plan-add-ex-btn" id="peAddEx">＋ 添加动作</button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn--cancel" id="peCancel">取消</button>
      <button class="modal-btn--danger" id="peDelete" style="flex:0.6">删除</button>
      <button class="modal-btn--save" id="peSave">保存</button>
    </div>
  </div>
</div>

<!-- ===== ADD EXERCISE MODAL ===== -->
<div class="modal-overlay" id="peExModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">添加动作</div>
    <div class="form-group">
      <label class="form-label">动作名称</label>
      <input class="exercise-input" id="peExName" list="exerciseList" placeholder="输入或选择动作..." autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">重量 (kg)</label>
      <div class="weight-grid" id="peExWeight"></div>
    </div>
    <div class="form-group">
      <label class="form-label">目标次数</label>
      <div class="stepper" style="max-width:160px">
        <button class="stepper-btn" id="peExRepsDown">−</button>
        <span class="stepper-value" id="peExRepsVal">12</span>
        <button class="stepper-btn" id="peExRepsUp">+</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">休息时间</label>
      <div class="rest-presets" id="peExRestPresets"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn--cancel" id="peExCancel">取消</button>
      <button class="modal-btn--save" id="peExConfirm">✅ 添加</button>
    </div>
  </div>
</div>

<!-- ===== EDIT ENTRY MODAL ===== -->
<div class="modal-overlay" id="editModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ 编辑记录</div>
    <div class="form-group">
      <label class="form-label">动作名称</label>
      <input class="exercise-input" id="editExercise" placeholder="动作名称">
    </div>
    <div class="form-group">
      <label class="form-label">重量 (kg)</label>
      <div class="weight-grid" id="editWeightGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">次数</label>
      <div class="reps-row">
        <div class="reps-group">
          <div class="form-label">目标</div>
          <div class="stepper">
            <button class="stepper-btn" data-stepper="edit-target" data-dir="-">−</button>
            <span class="stepper-value" id="editTargetValue">12</span>
            <button class="stepper-btn" data-stepper="edit-target" data-dir="+">+</button>
          </div>
        </div>
        <div class="reps-group">
          <div class="form-label">实际</div>
          <div class="stepper">
            <button class="stepper-btn" data-stepper="edit-actual" data-dir="-">−</button>
            <span class="stepper-value" id="editActualValue">12</span>
            <button class="stepper-btn" data-stepper="edit-actual" data-dir="+">+</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn--cancel" id="editCancel">取消</button>
      <button class="modal-btn--save" id="editSave">💾 保存</button>
    </div>
  </div>
</div>

<!-- ===== DELETE CONFIRM ===== -->
<div class="delete-confirm" id="deleteConfirm">
  <div class="delete-box">
    <div class="delete-box__graphic">🗑️</div>
    <div class="delete-box__text" id="delText">确定删除？</div>
    <div class="delete-box__sub" id="delSub">此操作无法撤销</div>
    <div class="delete-box__actions">
      <button class="delete-btn--no" id="deleteNo">取消</button>
      <button class="delete-btn--yes" id="deleteYes">删除</button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toastContainer"></div>

<script src="dumbbell-tracker-v2.js?v2"></script>
</body>
</html>
